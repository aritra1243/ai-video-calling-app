version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai_meeting_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai-meeting-app

  backend:
    build: ./backend
    container_name: ai_meeting_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ai-meeting-app
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6IHzJo5yGOOB0ZY0OI4-4TXvNUpu5H1GAsMXc9zK2O7Rg}
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service
    volumes:
      - ./backend/storage:/app/storage

  ai-service:
    build: ./backend/ai-service
    container_name: ai_meeting_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8

  frontend:
    build: ./frontend
    container_name: ai_meeting_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
